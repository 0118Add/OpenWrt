name: Build sing-box reF1nd

on:
  workflow_dispatch:

  #schedule:
    # 01:30 Singapore / 17:30 UTC
    #- cron: "30 17 * * *"

permissions:
  contents: write

env:
  # ============================================================
  # Build features
  #
  # with_quic       = TUIC / Hysteria2
  # with_utls       = VLESS Reality / Vision
  # with_clash_api  = Clash API
  #
  # AnyTLS does not require an additional build tag.
  # NaiveProxy is intentionally NOT included.
  # ============================================================

  BUILD_TAGS: "with_quic,with_utls,with_clash_api"

  # Latest Go 1.26 patch release
  GO_VERSION: "1.26.x"

  # UPX
  UPX_VERSION: "5.2.0"


# ==============================================================
# Detect reF1nd Stable version
# ==============================================================

jobs:

  stable_version:

    name: Detect Stable version

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}

    steps:

      - name: Detect latest reF1nd Stable tag
        id: detect
        shell: bash

        run: |
          set -euo pipefail

          echo "Fetching reF1nd tags..."

          git ls-remote --tags --refs \
            https://github.com/reF1nd/sing-box.git \
            > /tmp/tags.txt

          VERSION="$(
            sed 's#.*refs/tags/v##' /tmp/tags.txt |
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+-reF1nd$' |
            sort -V |
            tail -n 1
          )"

          if [ -z "${VERSION}" ]; then
            echo "ERROR: Cannot find reF1nd Stable tag."
            exit 1
          fi

          TAG="v${VERSION}"

          echo "Stable version: ${VERSION}"
          echo "Stable tag:     ${TAG}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"


# ==============================================================
# Detect reF1nd Testing version
# ==============================================================

  testing_version:

    name: Detect Testing version

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}

    steps:

      - name: Detect latest reF1nd Testing tag
        id: detect
        shell: bash

        run: |
          set -euo pipefail

          echo "Fetching reF1nd tags..."

          git ls-remote --tags --refs \
            https://github.com/reF1nd/sing-box.git \
            > /tmp/tags.txt

          VERSION="$(
            sed 's#.*refs/tags/v##' /tmp/tags.txt |
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+-reF1nd.*$' |
            sort -V |
            tail -n 1
          )"

          if [ -z "${VERSION}" ]; then
            echo "ERROR: Cannot find reF1nd Testing tag."
            exit 1
          fi

          TAG="v${VERSION}"

          echo "Testing version: ${VERSION}"
          echo "Testing tag:     ${TAG}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"


# ==============================================================
# Stable build
# ==============================================================

  stable_build:

    name: Stable / ${{ matrix.name }}

    needs:
      - stable_version

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:

        include:

          # ----------------------------------------------------
          # OpenWrt 64-bit ARM
          # ----------------------------------------------------

          - name: linux-arm64
            goos: linux
            goarch: arm64

          # ----------------------------------------------------
          # OpenWrt 32-bit ARM
          # ARMv7
          # ----------------------------------------------------

          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"

          # ----------------------------------------------------
          # Linux x86_64
          # ----------------------------------------------------

          - name: linux-amd64
            goos: linux
            goarch: amd64
            goamd64: v1

          # ----------------------------------------------------
          # Windows x86_64
          # ----------------------------------------------------

          - name: windows-amd64
            goos: windows
            goarch: amd64
            goamd64: v1

    env:

      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOAMD64: ${{ matrix.goamd64 }}

      CGO_ENABLED: 0

      VERSION: ${{ needs.stable_version.outputs.version }}
      TAG: ${{ needs.stable_version.outputs.tag }}

    steps:

      # ========================================================
      # Source
      # ========================================================

      - name: Checkout reF1nd Stable
        uses: actions/checkout@v7

        with:
          repository: reF1nd/sing-box
          ref: reF1nd-stable
          fetch-depth: 0


      # ========================================================
      # Go
      # ========================================================

      - name: Setup Go
        uses: actions/setup-go@v7

        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true


      # ========================================================
      # Setup UPX
      # ========================================================

      - name: Setup UPX
        shell: bash

        run: |
          set -euo pipefail

          UPX_URL="https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"

          echo "Downloading UPX ${UPX_VERSION}..."

          rm -f /tmp/upx.tar.xz

          for attempt in 1 2 3 4 5; do

            echo "Attempt ${attempt}/5..."

            if curl \
              -fL \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 20 \
              --max-time 180 \
              "${UPX_URL}" \
              -o /tmp/upx.tar.xz; then

              echo "UPX download successful."
              break

            fi

            if [ "${attempt}" -eq 5 ]; then
              echo "ERROR: Failed to download UPX after 5 attempts."
              exit 1
            fi

            sleep 10

          done

          test -s /tmp/upx.tar.xz

          rm -rf /tmp/upx
          mkdir -p /tmp/upx

          tar \
            -xJf /tmp/upx.tar.xz \
            -C /tmp/upx \
            --strip-components=1

          test -x /tmp/upx/upx

          sudo install \
            -m 0755 \
            /tmp/upx/upx \
            /usr/local/bin/upx

          echo "========== UPX VERSION =========="
          upx --version


      # ========================================================
      # Show build environment
      # ========================================================

      - name: Show build environment
        shell: bash

        run: |
          set -euo pipefail

          echo "========== Go =========="
          go version

          echo
          echo "========== UPX =========="
          upx --version

          echo
          echo "========== Target =========="
          echo "GOOS=${GOOS}"
          echo "GOARCH=${GOARCH}"
          echo "GOARM=${GOARM:-}"
          echo "GOAMD64=${GOAMD64:-}"

          echo
          echo "========== Version =========="
          echo "${VERSION}"

          echo
          echo "========== Tags =========="
          echo "${BUILD_TAGS}"


      # ========================================================
      # Build
      # ========================================================

      - name: Build Stable
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "${BUILD_TAGS}" \
            -o "${OUTPUT}" \
            ./cmd/sing-box

          chmod +x "${OUTPUT}"

          echo "========== BEFORE UPX =========="
          ls -lh "${OUTPUT}"


      # ========================================================
      # Verify binary architecture / format
      # ========================================================

      - name: Verify Stable binary
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          echo "========== FILE =========="

          file "${OUTPUT}"

          if [ "${GOOS}" = "linux" ]; then

            file "${OUTPUT}" | grep -q "ELF"

            case "${GOARCH}" in

              arm64)
                file "${OUTPUT}" | grep -Eiq "ARM aarch64|ARM64"
                ;;

              arm)
                file "${OUTPUT}" | grep -Eiq "ARM"
                ;;

              amd64)
                file "${OUTPUT}" | grep -Eiq "x86-64|x86_64"
                ;;

            esac

          elif [ "${GOOS}" = "windows" ]; then

            file "${OUTPUT}" | grep -Eiq "PE32\+"

          fi

          echo
          echo "Binary format / architecture: PASS"


      # ========================================================
      # Verify build tags
      # ========================================================

      - name: Verify Stable build tags
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          strings "${OUTPUT}" > /tmp/singbox-strings.txt

          grep -q "sing-box" /tmp/singbox-strings.txt
          grep -q "with_quic" /tmp/singbox-strings.txt
          grep -q "with_utls" /tmp/singbox-strings.txt
          grep -q "with_clash_api" /tmp/singbox-strings.txt

          echo "with_quic:      PASS"
          echo "with_utls:      PASS"
          echo "with_clash_api: PASS"


      # ========================================================
      # Native runtime test
      # ========================================================

      - name: Runtime test Stable AMD64
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          "./${OUTPUT}" version


      # ========================================================
      # UPX compression
      # ========================================================

      - name: UPX compress Stable
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          echo "========== BEFORE =========="
          ls -lh "${OUTPUT}"

          echo
          echo "Compressing with UPX ${UPX_VERSION}..."

          upx \
            --best \
            --lzma \
            "${OUTPUT}"

          echo
          echo "========== AFTER =========="
          ls -lh "${OUTPUT}"

          echo
          echo "========== UPX TEST =========="

          upx -t "${OUTPUT}"

          echo
          echo "========== UPX INFO =========="

          upx -l "${OUTPUT}"


      # ========================================================
      # Windows extension
      # ========================================================

      - name: Finalize Stable artifact
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          if [ "${GOOS}" = "windows" ]; then

            mv \
              "${OUTPUT}" \
              "${OUTPUT}.exe"

          fi

          echo "========== FINAL ARTIFACT =========="

          ls -lh sing-box-*


      # ========================================================
      # Upload Actions artifact
      # ========================================================

      - name: Upload Stable artifact
        uses: actions/upload-artifact@v7

        with:
          name: stable-${{ matrix.name }}

          path: |
            sing-box-*

          if-no-files-found: error


# ==============================================================
# Testing build
# ==============================================================

  testing_build:

    name: Testing / ${{ matrix.name }}

    needs:
      - testing_version

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:

        include:

          # ----------------------------------------------------
          # OpenWrt 64-bit ARM
          # ----------------------------------------------------

          - name: linux-arm64
            goos: linux
            goarch: arm64

          # ----------------------------------------------------
          # OpenWrt 32-bit ARM
          # ARMv7
          # ----------------------------------------------------

          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"

          # ----------------------------------------------------
          # Linux x86_64
          # ----------------------------------------------------

          - name: linux-amd64
            goos: linux
            goarch: amd64
            goamd64: v1

          # ----------------------------------------------------
          # Windows x86_64
          # ----------------------------------------------------

          - name: windows-amd64
            goos: windows
            goarch: amd64
            goamd64: v1

    env:

      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOAMD64: ${{ matrix.goamd64 }}

      CGO_ENABLED: 0

      VERSION: ${{ needs.testing_version.outputs.version }}
      TAG: ${{ needs.testing_version.outputs.tag }}

    steps:

      # ========================================================
      # Source
      # ========================================================

      - name: Checkout reF1nd Testing
        uses: actions/checkout@v7

        with:
          repository: reF1nd/sing-box
          ref: reF1nd-testing
          fetch-depth: 0


      # ========================================================
      # Go
      # ========================================================

      - name: Setup Go
        uses: actions/setup-go@v7

        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true


      # ========================================================
      # Setup UPX
      # ========================================================

      - name: Setup UPX
        shell: bash

        run: |
          set -euo pipefail

          UPX_URL="https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"

          echo "Downloading UPX ${UPX_VERSION}..."

          rm -f /tmp/upx.tar.xz

          for attempt in 1 2 3 4 5; do

            echo "Attempt ${attempt}/5..."

            if curl \
              -fL \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 20 \
              --max-time 180 \
              "${UPX_URL}" \
              -o /tmp/upx.tar.xz; then

              echo "UPX download successful."
              break

            fi

            if [ "${attempt}" -eq 5 ]; then
              echo "ERROR: Failed to download UPX after 5 attempts."
              exit 1
            fi

            sleep 10

          done

          test -s /tmp/upx.tar.xz

          rm -rf /tmp/upx
          mkdir -p /tmp/upx

          tar \
            -xJf /tmp/upx.tar.xz \
            -C /tmp/upx \
            --strip-components=1

          test -x /tmp/upx/upx

          sudo install \
            -m 0755 \
            /tmp/upx/upx \
            /usr/local/bin/upx

          upx --version


      # ========================================================
      # Show build environment
      # ========================================================

      - name: Show build environment
        shell: bash

        run: |
          set -euo pipefail

          echo "========== Go =========="
          go version

          echo
          echo "========== UPX =========="
          upx --version

          echo
          echo "========== Target =========="
          echo "GOOS=${GOOS}"
          echo "GOARCH=${GOARCH}"
          echo "GOARM=${GOARM:-}"
          echo "GOAMD64=${GOAMD64:-}"

          echo
          echo "========== Version =========="
          echo "${VERSION}"

          echo
          echo "========== Tags =========="
          echo "${BUILD_TAGS}"


      # ========================================================
      # Build
      # ========================================================

      - name: Build Testing
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          go build \
            -v \
            -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
            -tags "${BUILD_TAGS}" \
            -o "${OUTPUT}" \
            ./cmd/sing-box

          chmod +x "${OUTPUT}"

          echo "========== BEFORE UPX =========="

          ls -lh "${OUTPUT}"


      # ========================================================
      # Verify architecture
      # ========================================================

      - name: Verify Testing binary
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          file "${OUTPUT}"

          if [ "${GOOS}" = "linux" ]; then

            file "${OUTPUT}" | grep -q "ELF"

            case "${GOARCH}" in

              arm64)
                file "${OUTPUT}" | grep -Eiq "ARM aarch64|ARM64"
                ;;

              arm)
                file "${OUTPUT}" | grep -Eiq "ARM"
                ;;

              amd64)
                file "${OUTPUT}" | grep -Eiq "x86-64|x86_64"
                ;;

            esac

          elif [ "${GOOS}" = "windows" ]; then

            file "${OUTPUT}" | grep -Eiq "PE32\+"

          fi

          echo "Binary format / architecture: PASS"


      # ========================================================
      # Verify build tags
      # ========================================================

      - name: Verify Testing build tags
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          strings "${OUTPUT}" > /tmp/singbox-strings.txt

          grep -q "sing-box" /tmp/singbox-strings.txt
          grep -q "with_quic" /tmp/singbox-strings.txt
          grep -q "with_utls" /tmp/singbox-strings.txt
          grep -q "with_clash_api" /tmp/singbox-strings.txt

          echo "Required build tags: PASS"


      # ========================================================
      # Native runtime test
      # ========================================================

      - name: Runtime test Testing AMD64
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          "./${OUTPUT}" version


      # ========================================================
      # UPX compression
      # ========================================================

      - name: UPX compress Testing
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          echo "========== BEFORE =========="

          ls -lh "${OUTPUT}"

          upx \
            --best \
            --lzma \
            "${OUTPUT}"

          echo
          echo "========== AFTER =========="

          ls -lh "${OUTPUT}"

          echo
          echo "========== UPX TEST =========="

          upx -t "${OUTPUT}"

          echo
          echo "========== UPX INFO =========="

          upx -l "${OUTPUT}"


      # ========================================================
      # Windows extension
      # ========================================================

      - name: Finalize Testing artifact
        shell: bash

        run: |
          set -euo pipefail

          OUTPUT="sing-box-${{ matrix.name }}-${VERSION}"

          if [ "${GOOS}" = "windows" ]; then

            mv \
              "${OUTPUT}" \
              "${OUTPUT}.exe"

          fi

          echo "========== FINAL ARTIFACT =========="

          ls -lh sing-box-*


      # ========================================================
      # Upload Actions artifact
      # ========================================================

      - name: Upload Testing artifact
        uses: actions/upload-artifact@v7

        with:
          name: testing-${{ matrix.name }}

          path: |
            sing-box-*

          if-no-files-found: error


# ==============================================================
# Release
# ==============================================================

  release:

    name: Publish Release

    needs:
      - stable_version
      - testing_version
      - stable_build
      - testing_build

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # Download Stable artifacts
      # ========================================================

      - name: Download Stable artifacts
        uses: actions/download-artifact@v7

        with:
          pattern: stable-*
          path: release/stable
          merge-multiple: true


      # ========================================================
      # Download Testing artifacts
      # ========================================================

      - name: Download Testing artifacts
        uses: actions/download-artifact@v7

        with:
          pattern: testing-*
          path: release/testing
          merge-multiple: true


      # ========================================================
      # Verify release files
      # ========================================================

      - name: Verify release files
        shell: bash

        run: |
          set -euo pipefail

          echo "========== Stable =========="

          find release/stable \
            -maxdepth 1 \
            -type f \
            -print

          echo
          echo "========== Testing =========="

          find release/testing \
            -maxdepth 1 \
            -type f \
            -print

          echo
          echo "========== Counts =========="

          STABLE_COUNT="$(
            find release/stable \
              -maxdepth 1 \
              -type f \
              \( \
                -name "sing-box-linux-*" \
                -o \
                -name "sing-box-windows-*.exe" \
              \) |
            wc -l
          )"

          TESTING_COUNT="$(
            find release/testing \
              -maxdepth 1 \
              -type f \
              \( \
                -name "sing-box-linux-*" \
                -o \
                -name "sing-box-windows-*.exe" \
              \) |
            wc -l
          )"

          echo "Stable : ${STABLE_COUNT}"
          echo "Testing: ${TESTING_COUNT}"

          test "${STABLE_COUNT}" -eq 4
          test "${TESTING_COUNT}" -eq 4

          echo "Artifact count: PASS"


      # ========================================================
      # Verify UPX
      # ========================================================

      - name: Verify release UPX
        shell: bash

        run: |
          set -euo pipefail

          echo "========== Stable UPX =========="

          upx -t \
            "release/stable/sing-box-linux-arm64-${{ needs.stable_version.outputs.version }}"

          upx -t \
            "release/stable/sing-box-linux-armv7-${{ needs.stable_version.outputs.version }}"

          upx -t \
            "release/stable/sing-box-linux-amd64-${{ needs.stable_version.outputs.version }}"

          upx -t \
            "release/stable/sing-box-windows-amd64-${{ needs.stable_version.outputs.version }}.exe"


          echo
          echo "========== Testing UPX =========="

          upx -t \
            "release/testing/sing-box-linux-arm64-${{ needs.testing_version.outputs.version }}"

          upx -t \
            "release/testing/sing-box-linux-armv7-${{ needs.testing_version.outputs.version }}"

          upx -t \
            "release/testing/sing-box-linux-amd64-${{ needs.testing_version.outputs.version }}"

          upx -t \
            "release/testing/sing-box-windows-amd64-${{ needs.testing_version.outputs.version }}.exe"

          echo
          echo "UPX verification: PASS"


      # ========================================================
      # Generate SHA256
      # ========================================================

      - name: Generate SHA256
        shell: bash

        run: |
          set -euo pipefail

          cd release

          find . \
            -type f \
            \( \
              -name "sing-box-linux-*" \
              -o \
              -name "sing-box-windows-*.exe" \
            \) \
            -print0 |
          sort -z |
          xargs -0 sha256sum \
            > SHA256SUMS

          echo "========== SHA256SUMS =========="

          cat SHA256SUMS


      # ========================================================
      # Release notes
      # ========================================================

      - name: Generate release notes
        shell: bash

        run: |

          cat > release/RELEASE.md <<EOF

          # sing-box reF1nd

          ## Stable

          v${{ needs.stable_version.outputs.version }}

          ## Testing

          v${{ needs.testing_version.outputs.version }}

          ## Build tags

          \`${BUILD_TAGS}\`

          ## Go

          \`${GO_VERSION}\`

          ## UPX

          \`${UPX_VERSION}\`

          All binaries are compressed using:
          \`upx --best --lzma\`

          The UPX-compressed binaries are released
          directly without ZIP/TAR/GZ packaging.

          Linux filenames intentionally do NOT use
          the \`.upx\` suffix.

          ## Supported protocols / features

          - VLESS Reality / Vision
          - TUIC
          - Hysteria2
          - AnyTLS
          - Clash API

          ## Linux architectures

          - ARM64 / AArch64
          - ARMv7 / 32-bit ARM
          - AMD64 / x86_64

          ## Windows architecture

          - AMD64 / x86_64

          EOF


      # ========================================================
      # Delete previous rolling release
      #
      # IMPORTANT:
      #
      # Do NOT use:
      #
      #   gh release view sing-box
      #
      # or:
      #
      #   gh release delete sing-box --cleanup-tag
      #
      # because a stale/missing tag reference can return HTTP 422.
      #
      # Release and tag are handled independently.
      # ========================================================

      - name: Delete previous rolling release
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          TAG="sing-box"

          echo "========================================"
          echo "Cleaning previous rolling release"
          echo "Repository: ${REPO}"
          echo "Tag:        ${TAG}"
          echo "========================================"


          # ======================================================
          # Delete Release
          # ======================================================

          echo
          echo "Checking existing release..."

          HTTP_STATUS="$(
            gh api \
              --include \
              "repos/${REPO}/releases/tags/${TAG}" \
              2>/dev/null |
            head -n 1 |
            awk '{print $2}' \
            || true
          )"

          echo "Release API status: ${HTTP_STATUS:-unknown}"

          if [ "${HTTP_STATUS}" = "200" ]; then

            echo "Existing release found."

            RELEASE_ID="$(
              gh api \
                "repos/${REPO}/releases/tags/${TAG}" |
              jq -r '.id'
            )"

            echo "Release ID: ${RELEASE_ID}"

            gh api \
              --method DELETE \
              "repos/${REPO}/releases/${RELEASE_ID}"

            echo "Release deleted."

          elif [ "${HTTP_STATUS}" = "404" ]; then

            echo "No existing release found."

          else

            echo "Unexpected GitHub API response."
            echo "HTTP status: ${HTTP_STATUS}"
            exit 1

          fi


          # ======================================================
          # Delete tag
          # ======================================================

          echo
          echo "Checking existing tag..."

          if gh api \
            "repos/${REPO}/git/ref/tags/${TAG}" \
            >/dev/null 2>&1; then

            echo "Existing tag found."

            gh api \
              --method DELETE \
              "repos/${REPO}/git/refs/tags/${TAG}"

            echo "Tag deleted."

          else

            echo "No existing tag found."

          fi


          echo
          echo "========================================"
          echo "Previous rolling release cleanup: PASS"
          echo "========================================"


      # ========================================================
      # Create draft release
      # ========================================================

      - name: Create draft release
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          gh release create sing-box \
            --repo "${GITHUB_REPOSITORY}" \
            --title "sing-box reF1nd Latest" \
            --notes-file release/RELEASE.md \
            --target "${GITHUB_SHA}" \
            --draft


      # ========================================================
      # Upload release assets
      #
      # IMPORTANT:
      #
      # Direct binary upload.
      #
      # NO ZIP
      # NO TAR.GZ
      # NO .UPX suffix
      #
      # The files themselves are UPX compressed.
      # ========================================================

      - name: Upload release assets
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          gh release upload sing-box \
            "release/stable/sing-box-linux-arm64-${{ needs.stable_version.outputs.version }}" \
            "release/stable/sing-box-linux-armv7-${{ needs.stable_version.outputs.version }}" \
            "release/stable/sing-box-linux-amd64-${{ needs.stable_version.outputs.version }}" \
            "release/stable/sing-box-windows-amd64-${{ needs.stable_version.outputs.version }}.exe" \
            "release/testing/sing-box-linux-arm64-${{ needs.testing_version.outputs.version }}" \
            "release/testing/sing-box-linux-armv7-${{ needs.testing_version.outputs.version }}" \
            "release/testing/sing-box-linux-amd64-${{ needs.testing_version.outputs.version }}" \
            "release/testing/sing-box-windows-amd64-${{ needs.testing_version.outputs.version }}.exe" \
            release/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}"


      # ========================================================
      # Publish release
      # ========================================================

      - name: Publish release
        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          gh release edit sing-box \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
